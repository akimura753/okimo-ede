<!DOCTYPE html>
<html lang="ja">

<title>SAGASU v6 brl ― なにがあるかな？カメラ（通電点字）</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{--bg:#0b1020;--card:#1f2937;--acc:#2563eb;--ok:#16a34a;--warn:#f59e0b;--ng:#dc2626;--fg:#fff;--pink:#ec4899}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;padding:8px}
  .wrap{max-width:720px;margin:0 auto;display:grid;gap:10px}
  h1{font-size:1.3rem;text-align:center}
  #status{font-size:1.5rem;font-weight:900;text-align:center;min-height:2.4em;line-height:1.3;padding:10px;border-radius:20px;background:#1e293b;border:3px solid #334155}
  #status.talk{border-color:var(--pink)}
  .stage{position:relative;aspect-ratio:3/4;max-height:50dvh;background:#000;border-radius:20px;overflow:hidden;margin:0 auto;width:100%;touch-action:manipulation}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
  button{width:100%;min-height:64px;padding:12px;border:3px solid #fff;border-radius:20px;font-size:1.3rem;font-weight:700;color:#fff;background:var(--acc);cursor:pointer}
  button:disabled{opacity:.35}
  button.on{background:var(--ok)}
  button.mic{background:var(--pink)}button.mic.on{background:var(--ok);box-shadow:0 0 14px var(--ok)}
  button.find{background:var(--warn);color:#000}
  button.ask{background:#7c3aed}
  button.sig{background:#0f766e}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  select{font-size:1.1rem;padding:8px;border-radius:10px;width:100%}

<body>
<div class="wrap">
  <h1>📷 SAGASU v6 ― なにがあるかな？カメラ</h1>
  <div id="status" role="status" aria-live="assertive">「カメラをつける」を押してね</div>
  <div id="heard"></div>
  <div class="hint">声で「ここに何があるかな」「それ何色？」「どんな形？」「動いてる？」「手のひらより大きい？」「信号を見て」「コップさがして」「もういちど」と言えるよ<br>カメラ画面をタップ → そのマスの物を読む／ほかの場所をタップ → もう一度</div>
  <div class="stage" id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="target">いま見ている物：なし</div>
  <button id="btnCam" class="on">📷 カメラをつける</button>
  <button id="btnMic" class="mic" disabled>🎤 声で話しかける OFF</button>
  <button id="btnScan" disabled>🔍 ここに何があるかな？</button>
  <div class="grid3">
    <button id="btnColor" class="small ask" disabled>🎨 それ何色？</button>
    <button id="btnShape" class="small ask" disabled>🔷 どんな形？</button>
    <button id="btnMove" class="small ask" disabled>🏃 動いてる？</button>
  </div>
  <div class="grid2">
    <button id="btnSize" class="small ask" disabled>✋ 手のひらより大きい？</button>
    <button id="btnSignal" class="small sig" disabled>🚦 信号を見て</button>
  </div>
  <div class="warn">⚠ 信号の読み上げは目安です。わたる前に必ず大人の人にたしかめてください。</div>
  <div class="grid2">
    <button id="btnAuto" class="small" disabled>🔁 自動（8秒ごと）OFF</button>
    <button id="btnCamSel" class="small">🔄 外カメラ ⇄ 内カメラ</button>
  </div>
  <div class="grid2">
    <select id="findSel" aria-label="さがす物"><option value="">さがす物を選ぶ…</option></select>
    <button id="btnFind" class="small find" disabled>🎯 さがして</button>
  </div>
  <label><input type="checkbox" id="chkNatural">場所を「上の左」みたいに言う（行・列のかわり）</label>
  <label><input type="checkbox" id="chkEmpty">なにもないマスも「なにもないよ」と言う</label>
  <label><input type="checkbox" id="chkDigits" checked>信号の数字も読む（初回は読み込みに時間がかかる）</label>
  <label><input type="checkbox" id="chkHiAcc">くわしいモデル（少しおそいけど正確）</label>
  <div class="grid2">
    <button id="btnUsb" class="small">⚡ Pico USB接続</button>
    <button id="btnBrlTest" class="small" disabled>⚡ 点字テスト送信</button>
  </div>
  <label><input type="checkbox" id="chkBrl" checked>読み上げを通電点字でも出す（Pico・6電極）</label>
  <div class="grid2">
    <input id="brlText" placeholder="点字テスト文（例: あか てんめつ）" style="min-height:48px;border-radius:14px;border:2px solid #475569;background:#0f172a;color:#fff;padding:8px;font-size:1.1rem">
    <select id="brlMode" aria-label="点字の長さ"><option value="kw">キーワードだけ送る</option><option value="kana">かな全文を送る</option></select>
  </div>
  <div id="brlLog" class="hint" style="white-space:pre-wrap;min-height:1.4em"></div>
  <div id="list">まだ見ていないよ</div>
</div>

<script type="module">
import {ObjectDetector, HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
let audioCtx=null;
function beep(freq=880,ms=60,vol=.25){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+ms/1000);}catch(e){}}

/* ================= Pico（通電点字）: USB シリアル(CDC) を WebUSB で直接つかむ ================= */
const usb={dev:null,epIn:null,epOut:null,ctrlIf:null,dataIf:null,ok:false,rx:''};
function brlLog(t){const el=$("brlLog");if(!el)return;el.textContent=(t+"\n"+el.textContent).split("\n").slice(0,4).join("\n");}
async function usbConnect(){
  if(!navigator.usb){brlLog("この端末のブラウザは WebUSB 非対応（Android の Chrome を使ってね）");return;}
  try{
    const dev=await navigator.usb.requestDevice({filters:[{vendorId:0x2E8A}]});
    await dev.open(); if(dev.configuration===null) await dev.selectConfiguration(1);
    for(const itf of dev.configuration.interfaces){const alt=itf.alternates[0];
      if(alt.interfaceClass===0x02) usb.ctrlIf=itf.interfaceNumber;
      if(alt.interfaceClass===0x0A){usb.dataIf=itf.interfaceNumber;for(const ep of alt.endpoints){if(ep.type==='bulk'){if(ep.direction==='out')usb.epOut=ep.endpointNumber;else usb.epIn=ep.endpointNumber;}}}}
    if(usb.ctrlIf!=null){try{await dev.claimInterface(usb.ctrlIf);}catch(e){}}
    await dev.claimInterface(usb.dataIf);
    try{await dev.controlTransferOut({requestType:'class',recipient:'interface',request:0x20,value:0,index:usb.ctrlIf??0},new Uint8Array([0x00,0xC2,0x01,0x00,0,0,8]));}catch(e){}
    try{await dev.controlTransferOut({requestType:'class',recipient:'interface',request:0x22,value:0x03,index:usb.ctrlIf??0});}catch(e){}
    usb.dev=dev;usb.ok=true;usbReadLoop();
    navigator.usb.addEventListener('disconnect',ev=>{if(ev.device===usb.dev){usb.ok=false;usb.dev=null;$("btnUsb").classList.remove("on");$("btnBrlTest").disabled=true;brlLog("USB が外れました");}});
    $("btnUsb").classList.add("on");$("btnUsb").textContent="⚡ Pico 接続中";$("btnBrlTest").disabled=false;
    await usbWrite('PING');await usbWrite('LANG ja');brlLog("Pico に接続したよ");say("ピコにつないだよ");
  }catch(e){usb.ok=false;brlLog("USB 接続できません: "+e.message);}}
async function usbWrite(line){if(!usb.ok)return false;
  try{await usb.dev.transferOut(usb.epOut,new TextEncoder().encode(line+'\n'));return true;}
  catch(e){usb.ok=false;brlLog("USB 送信失敗: "+e.message);return false;}}
async function usbReadLoop(){const dec=new TextDecoder();
  while(usb.ok){try{const r=await usb.dev.transferIn(usb.epIn,64);usb.rx+=dec.decode(r.data);let i;
    while((i=usb.rx.indexOf('\n'))>=0){const line=usb.rx.slice(0,i).trim();usb.rx=usb.rx.slice(i+1);
      if(!line)continue;let j=null;try{j=JSON.parse(line);}catch(e){}
      if(j&&j.kind==='txt')brlLog(`点字 ${j.text}（${j.n}マス）`);else if(j&&j.kind==='done')brlLog("点字 おわり");else if(!j)brlLog("Pico: "+line);}}
  catch(e){usb.ok=false;break;}}}
/* 読み上げ文 → 点字用のかな（キーワード or かな全文）。変換は Pico 側（TXT コマンド）で行う */
const kanaOnly=s=>s.replace(/[、。，．・「」！？!?]/g," ").replace(/[^ぁ-んァ-ヶー0-9０-９ 　]/g,"").replace(/\s+/g," ").trim();
const COLOR_KANA={"黒":"くろ","白":"しろ","灰色":"はいいろ","茶色":"ちゃいろ","赤":"あか","オレンジ":"おれんじ","黄色":"きいろ","緑":"みどり","水色":"みずいろ","青":"あお","紫":"むらさき","ピンク":"ぴんく"};
const NAME_KANA={person:"ひと",bicycle:"じてんしゃ",car:"くるま",motorcycle:"ばいく",bus:"ばす",train:"でんしゃ",truck:"とらっく","traffic light":"しんごう",bench:"べんち",bird:"とり",cat:"ねこ",dog:"いぬ",
  backpack:"りゅっく",umbrella:"かさ",handbag:"かばん",bottle:"ぼとる",cup:"こっぷ",fork:"ふぉーく",knife:"ないふ",spoon:"すぷーん",bowl:"おわん",chair:"いす",couch:"そふぁ",
  "potted plant":"はな",bed:"べっど","dining table":"つくえ",toilet:"といれ",tv:"てれび",laptop:"ぱそこん","cell phone":"すまほ",book:"ほん",clock:"とけい",scissors:"はさみ",
  banana:"ばなな",apple:"りんご",orange:"みかん",door:"どあ",stairs:"かいだん"};
function kanaShape(t){if(/三角/.test(t))return"さんかく";if(/四角/.test(t))return"しかく";if(/丸/.test(t))return"まる";
  if(/横に長/.test(t))return"よこながい";if(/縦に長/.test(t))return"たてながい";if(/棒/.test(t))return"ぼう";if(/平た/.test(t))return"ひらたい";return"わからない";}
function kanaSize(t){if(/ずっと大きい/.test(t))return"ずっと おおきい";if(/大きい/.test(t))return"おおきい";if(/同じ/.test(t))return"おなじ";
  if(/少し小さい/.test(t))return"すこし ちいさい";if(/小さい/.test(t))return"ちいさい";return"わからない";}
function brlSend(kw,full){
  if(!usb.ok||!$("chkBrl").checked)return;
  const text=($("brlMode").value==="kana"&&full)?kanaOnly(full):kw;
  if(!text)return;usbWrite("TXT "+text);}

/* ================= こどもの声 ================= */
let kidVoice=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("ja"));
  kidVoice=vs.find(v=>/Kyoko|Nanami|O-ren|Google 日本語|Haruka|Ayumi/i.test(v.name))||vs[0]||null;}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let speakToken=0,speaking=false;
function speakSeq(items){const my=++speakToken;
  return new Promise(res=>{if(!window.speechSynthesis){res();return;}
    speechSynthesis.cancel();let i=0;speaking=true;$("status").classList.add("talk");pauseMic();
    const done=()=>{speaking=false;$("status").classList.remove("talk");resumeMic();res();};
    const next=()=>{if(my!==speakToken||i>=items.length){done();return;}const it=items[i++];it.cb&&it.cb();
      const u=new SpeechSynthesisUtterance(it.text);u.lang="ja-JP";u.rate=1.05;u.pitch=1.6;if(kidVoice)u.voice=kidVoice;
      u.onend=next;u.onerror=next;speechSynthesis.speak(u);};next();});}
const say=t=>speakSeq([{text:t}]);
let lastItems=[];
document.addEventListener("click",e=>{if(e.target.closest("button,input,label,select,#stage"))return;if(lastItems.length)speakSeq(lastItems);vib([60]);});

/* ================= COCO 80クラス → 日本語 ================= */
const JA={person:"人",bicycle:"自転車",car:"車",motorcycle:"バイク",airplane:"飛行機",bus:"バス",train:"電車",truck:"トラック",boat:"船",
"traffic light":"信号機","fire hydrant":"消火栓","stop sign":"止まれの標識","parking meter":"パーキングメーター",bench:"ベンチ",bird:"鳥",cat:"猫",dog:"犬",horse:"馬",
sheep:"羊",cow:"牛",elephant:"象",bear:"熊",zebra:"シマウマ",giraffe:"キリン",backpack:"リュック",umbrella:"傘",handbag:"ハンドバッグ",tie:"ネクタイ",suitcase:"スーツケース",
frisbee:"フリスビー",skis:"スキー板",snowboard:"スノーボード","sports ball":"ボール",kite:"たこ","baseball bat":"バット","baseball glove":"グローブ",skateboard:"スケートボード",
surfboard:"サーフボード","tennis racket":"ラケット",bottle:"ボトル","wine glass":"ワイングラス",cup:"コップ",fork:"フォーク",knife:"ナイフ",spoon:"スプーン",bowl:"おわん",
banana:"バナナ",apple:"りんご",sandwich:"サンドイッチ",orange:"みかん",broccoli:"ブロッコリー",carrot:"にんじん","hot dog":"ホットドッグ",pizza:"ピザ",donut:"ドーナツ",cake:"ケーキ",
chair:"いす",couch:"ソファ","potted plant":"観葉植物",bed:"ベッド","dining table":"テーブル",toilet:"トイレ",tv:"テレビ",laptop:"ノートパソコン",mouse:"マウス",remote:"リモコン",
keyboard:"キーボード","cell phone":"スマホ",microwave:"電子レンジ",oven:"オーブン",toaster:"トースター",sink:"流し",refrigerator:"冷蔵庫",book:"本",clock:"時計",vase:"花びん",
scissors:"はさみ","teddy bear":"ぬいぐるみ","hair drier":"ドライヤー",toothbrush:"歯ブラシ"};
const ja=n=>JA[n]||n;
const ALIAS={"ほん":"book","コップ":"cup","かばん":"handbag","いす":"chair","椅子":"chair","ケータイ":"cell phone","携帯":"cell phone","電話":"cell phone",
"パソコン":"laptop","ボトル":"bottle","ペットボトル":"bottle","水筒":"bottle","ねこ":"cat","いぬ":"dog","ぬいぐるみ":"teddy bear","はさみ":"scissors","時計":"clock","とけい":"clock","信号":"traffic light","しんごう":"traffic light"};
for(const[k,v]of Object.entries(JA)){const o=document.createElement("option");o.value=k;o.textContent=v;$("findSel").appendChild(o);}
/* 種類から分かる形 */
const SHAPE_BY_CLASS={"sports ball":"まるい",orange:"まるい",apple:"まるい",donut:"まるい（まん中に穴）",clock:"まるい",frisbee:"まるくて平たい",bowl:"まるくて深い",
  cup:"筒の形",bottle:"細長い筒の形","wine glass":"上が広がった筒の形",vase:"筒の形",book:"四角くて平たい",laptop:"四角くて平たい",tv:"四角い",
  "cell phone":"四角くて平たい",remote:"細長い四角",keyboard:"横に長い四角",microwave:"箱の形",refrigerator:"縦に長い箱の形",suitcase:"箱の形",
  banana:"細長くて曲がってる",carrot:"細長い",knife:"細長い",fork:"細長い",spoon:"細長い",toothbrush:"細長い","baseball bat":"細長い棒",umbrella:"傘の形",
  pizza:"まるくて平たい",cake:"まるい",sandwich:"三角か四角",chair:"いすの形",person:"人の形",cat:"ねこの形",dog:"いぬの形","teddy bear":"ぬいぐるみの形","traffic light":"縦に長い箱の形"};
/* 種類ごとの「ふつうの大きさ」（いちばん長い辺・cm） */
const SIZE_CM={person:170,bicycle:170,car:450,motorcycle:200,airplane:3000,bus:1100,train:2000,truck:700,boat:500,
  "traffic light":100,"fire hydrant":80,"stop sign":75,"parking meter":150,bench:150,bird:20,cat:45,dog:60,horse:200,sheep:120,cow:200,
  elephant:600,bear:200,zebra:230,giraffe:500,backpack:45,umbrella:90,handbag:35,tie:140,suitcase:60,frisbee:25,skis:170,snowboard:150,
  "sports ball":22,kite:100,"baseball bat":85,"baseball glove":30,skateboard:80,surfboard:200,"tennis racket":68,bottle:25,"wine glass":20,
  cup:9,fork:19,knife:22,spoon:18,bowl:15,banana:18,apple:8,sandwich:12,orange:7,broccoli:15,carrot:18,"hot dog":15,pizza:30,donut:9,cake:20,
  chair:90,couch:200,"potted plant":40,bed:200,"dining table":150,toilet:70,tv:100,laptop:33,mouse:11,remote:18,keyboard:44,"cell phone":15,
  microwave:50,oven:60,toaster:28,sink:60,refrigerator:170,book:21,clock:30,vase:25,scissors:18,"teddy bear":30,"hair drier":22,toothbrush:19};
const PALM_CM=18;

/* ================= 場所・大きさ・数の言葉 ================= */
const ROWJ=["上","まん中","下"],COLJ=["左","まん中","右"];
function cellName(r,c){if(!$("chkNatural").checked)return`${r+1}行${c+1}列`;if(r===1&&c===1)return"まん中";return`${ROWJ[r]}の${COLJ[c]}`;}
const CROSS=[{name:"左上のクロス",x:1/3,y:1/3},{name:"右上のクロス",x:2/3,y:1/3},{name:"左下のクロス",x:1/3,y:2/3},{name:"右下のクロス",x:2/3,y:2/3}];
function sizeWord(d){const a=d.w*d.h;return a>=0.25?"大きい":a>=0.06?"中くらいの":"小さい";}
const COUNT=["","一つ","二つ","三つ","四つ","五つ","六つ","七つ","八つ","九つ"];
const cnt=n=>n<10?COUNT[n]:`${n}個`;
function describe(arr){const byName={};arr.forEach(d=>(byName[d.name]=byName[d.name]||[]).push(d));
  return Object.entries(byName).map(([n,ds])=>ds.length===1?`${sizeWord(ds[0])}${ja(n)}が一つ`:`${ja(n)}が${cnt(ds.length)}`).join("と、");}

/* ================= カメラ・検出 ================= */
const video=$("video"),cv=$("overlay"),ctx=cv.getContext("2d");
const pc=document.createElement("canvas");pc.width=pc.height=48;const pctx=pc.getContext("2d",{willReadFrequently:true});
let det=null,lastT=-1,facing="environment",latest=[],auto=false,autoTimer=null,busy=false,lastScan=null,finding=null;
let target=null;const hist=[];
async function loadModel(){
  const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const m=$("chkHiAcc").checked?"efficientdet_lite2":"efficientdet_lite0";
  det=await ObjectDetector.createFromOptions(vision,{baseOptions:{modelAssetPath:
    `https://storage.googleapis.com/mediapipe-models/object_detector/${m}/float16/1/${m}.tflite`,delegate:"GPU"},
    scoreThreshold:0.4,maxResults:20,runningMode:"VIDEO"});}
async function startCam(){
  $("btnCam").disabled=true;$("status").textContent="ちょっとまってね…";say("ちょっとまってね。じゅんびしてるよ");
  try{
    if(!det)await loadModel();
    if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());
    video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});
    await video.play();cv.width=video.videoWidth;cv.height=video.videoHeight;
    $("stage").classList.toggle("mirror",facing==="user");
    $("btnCam").textContent="📷 カメラをつけなおす";$("btnCam").disabled=false;
    ["btnScan","btnAuto","btnFind","btnMic","btnColor","btnShape","btnMove","btnSize","btnSignal"].forEach(i=>$(i).disabled=false);
    $("status").textContent="じゅんびできたよ！「ここに何があるかな？」って聞いてね";
    await say("じゅんびできたよ！ ここに何があるかな、って聞いてね。マイクのボタンを押すと、声でお話しできるよ");
    requestAnimationFrame(loop);
  }catch(e){$("status").textContent="カメラがつかえないみたい："+e.message;say("ごめんね、カメラがつかえないみたい");$("btnCam").disabled=false;}}
$("btnCam").onclick=startCam;
$("btnCamSel").onclick=()=>{facing=facing==="environment"?"user":"environment";say(facing==="environment"?"外のカメラにしたよ":"内側のカメラにしたよ");if(det)startCam();};
$("chkHiAcc").onchange=async()=>{if(!det)return;$("status").textContent="モデルを入れかえ中…";det=null;await loadModel();$("status").textContent="入れかえたよ";say("入れかえたよ");};

function loop(){
  if(det&&video.readyState>=2&&video.currentTime!==lastT){lastT=video.currentTime;const t=performance.now();
    const r=det.detectForVideo(video,t);
    latest=r.detections.map(d=>{const b=d.boundingBox;return{name:d.categories[0].categoryName,score:d.categories[0].score,

/* ================= 9マス割り当て ================= */
function insideFrac(d,r,c){const x0=Math.max(d.x,c/3),y0=Math.max(d.y,r/3),x1=Math.min(d.x+d.w,(c+1)/3),y1=Math.min(d.y+d.h,(r+1)/3);
  if(x1<=x0||y1<=y0)return 0;return((x1-x0)*(y1-y0))/(d.w*d.h+1e-9);}
function assign(ds){const cells=Array.from({length:9},()=>[]),cross=[[],[],[],[]];
  for(const d of ds){const cx=d.x+d.w/2,cy=d.y+d.h/2,r=Math.min(2,Math.floor(cy*3)),c=Math.min(2,Math.floor(cx*3));
    if(insideFrac(d,r,c)>=0.65)cells[r*3+c].push(d);
    else{let best=0,bd=9;CROSS.forEach((k,i)=>{const dd=Math.hypot(cx-k.x,cy-k.y);if(dd<bd){bd=dd;best=i;}});cross[best].push(d);}}

    if(m){m.n++;m.x+=(d.x-m.x)/m.n;m.y+=(d.y-m.y)/m.n;m.w+=(d.w-m.w)/m.n;m.h+=(d.h-m.h)/m.n;}else out.push({...d,n:1});}
  const kept=out.filter(o=>o.n>=2).sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2)||(a.x+a.w/2)-(b.x+b.w/2));
  kept.forEach((o,i)=>o.idx=i+1);return kept;}
function cellOf(d){const cx=d.x+d.w/2,cy=d.y+d.h/2;return cellName(Math.min(2,Math.floor(cy*3)),Math.min(2,Math.floor(cx*3)));}

/* ================= 注目している物（それ） ================= */
function setTarget(d){target=d?{name:d.name,x:d.x,y:d.y,w:d.w,h:d.h}:null;
  $("target").textContent="いま見ている物："+(target?ja(target.name):"なし");}
function matchTarget(ds){if(!target)return null;let best=null,bs=0.2;
  for(const d of ds)if(d.name===target.name){const s=iou(d,target);if(s>bs){bs=s;best=d;}}
  if(best){target.x=best.x;target.y=best.y;target.w=best.w;target.h=best.h;}return best;}

  const c=[...latest].sort((a,b)=>Math.hypot(a.x+a.w/2-.5,a.y+a.h/2-.5)-Math.hypot(b.x+b.w/2-.5,b.y+b.h/2-.5))[0];
  setTarget(c);return c;}

/* ================= 色 ================= */
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=0;
  if(d){if(M===r)h=((g-b)/d)%6;else if(M===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  return[h,M?d/M:0,M];}
function colorName(h,s,v){
  if(v<0.18)return"黒";if(s<0.16)return v>0.78?"白":"灰色";
  if(v<0.45&&h>=10&&h<50)return"茶色";
  if(h<15||h>=345)return"赤";if(h<45)return"オレンジ";if(h<70)return"黄色";if(h<170)return"緑";
  if(h<200)return"水色";if(h<260)return"青";if(h<300)return"紫";return"ピンク";}
function colorOf(d){const W=video.videoWidth,H=video.videoHeight;
  const sx=(d.x+d.w*0.2)*W,sy=(d.y+d.h*0.2)*H,sw=Math.max(1,d.w*0.6*W),sh=Math.max(1,d.h*0.6*H);
  pctx.drawImage(video,sx,sy,sw,sh,0,0,48,48);const px=pctx.getImageData(0,0,48,48).data;const c={};
  for(let i=0;i<px.length;i+=4){const[h,s,v]=rgb2hsv(px[i],px[i+1],px[i+2]);const n=colorName(h,s,v);c[n]=(c[n]||0)+1;}
  const tot=48*48;const top=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const names=[top[0][0]];if(top[1]&&top[1][1]/tot>=0.25)names.push(top[1][0]);return names;}

/* ================= 形 ================= */
function shapeOf(d){const ar=d.w/d.h;const base=SHAPE_BY_CLASS[d.name];
  const ratio=ar>1.6?"横に長い":ar<0.62?"縦に長い":ar>0.85&&ar<1.18?"縦と横が同じくらい":"";
  if(base)return ratio&&!/長い|棒|平たい/.test(base)?`${base}。${ratio}よ`:base;
  return ratio?`${ratio}形`:"はっきりした形はわからないな";}

/* ================= 動き ================= */
function motionOf(d){const now=performance.now();const pts=[];
  for(const f of hist){if(now-f.t>800)continue;let best=null,bs=0.2;
    for(const q of f.dets)if(q.name===d.name){const s=iou(q,d);if(s>bs){bs=s;best=q;}}
    if(best)pts.push({t:f.t,x:best.x+best.w/2,y:best.y+best.h/2});}
  if(pts.length<3)return{moving:false,text:"見えてる時間が短くて、まだわからないな"};
  const a=pts[0],b=pts[pts.length-1];const dx=(b.x-a.x)/Math.max(d.w,0.05),dy=(b.y-a.y)/Math.max(d.h,0.05);
  const dist=Math.hypot(dx,dy);if(dist<0.25)return{moving:false,text:"止まってるよ"};

const sc=document.createElement("canvas");const sctx=sc.getContext("2d",{willReadFrequently:true});
function litColor(d){const W=video.videoWidth,H=video.videoHeight;const w=Math.max(8,Math.round(d.w*W)),h=Math.max(8,Math.round(d.h*H));
  sc.width=Math.min(w,96);sc.height=Math.min(h,160);
  sctx.drawImage(video,d.x*W,d.y*H,w,h,0,0,sc.width,sc.height);
  const px=sctx.getImageData(0,0,sc.width,sc.height).data;const c={red:0,yellow:0,green:0};let n=0;

    const m=r.data.text.replace(/\D/g,"");return m&&m.length<=3&&r.data.confidence>40?m:null;}catch(e){return null;}}
async function askSignal(){

  if(micOn){micOn=false;try{rec.stop();}catch(e){}$("btnMic").className="mic";$("btnMic").textContent="🎤 声で話しかける OFF";say("マイクはおしまい");return;}
  rec=new SR();rec.lang="ja-JP";rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{const r=e.results[e.results.length-1];if(r.isFinal&&!speaking)handleSpeech(r[0].transcript);};
  rec.onend=()=>{if(micOn&&!micPaused)setTimeout(()=>{try{rec.start();}catch(e){}},300);};
  rec.onerror=e=>{if(e.error==="not-allowed"){micOn=false;$("btnMic").className="mic";$("btnMic").textContent="🎤 声で話しかける OFF";say("マイクがつかえないみたい");}};
  micOn=true;$("btnMic").className="mic on";$("btnMic").textContent="🎤 聞いてるよ（ON）";
  say("なあに？ ここに何があるかな、って聞いてね").then(()=>{try{rec.start();}catch(e){}});};
$("btnUsb").onclick=()=>{if(usb.ok){brlLog("接続済みだよ");return;}usbConnect();};
$("btnBrlTest").onclick=()=>{const t=$("brlText").value.trim()||"あか てんめつ";if(!usb.ok){brlLog("先に「Pico USB接続」を押してね");return;}usbWrite("TXT "+t);brlLog("送信: "+t);};
