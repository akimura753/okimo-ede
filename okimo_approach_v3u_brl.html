<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>OKIMO 人接近 通電点字 v3+U brl（EEGマーカー付き）</title>
<style>
  :root{
    --bg:#101418; --panel:#1a2028; --line:#2c3642; --fg:#e8edf2; --dim:#8a97a6;
    --c:#f5c542; --l:#5ec8ff; --r:#ff7a6b; --ok:#6fdc8c; --warn:#ff5c5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #stage{position:relative;width:100%;aspect-ratio:4/3;background:#000;overflow:hidden}
  #video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 1px 3px #000}
  #status{font-size:26px;font-weight:700;line-height:1.15}
  #status.c{color:var(--c)} #status.l{color:var(--l)} #status.r{color:var(--r)}
  #metrics{font-size:12px;color:#d9e1ea;text-align:right;line-height:1.4;white-space:pre}
  #session{position:absolute;left:10px;bottom:8px;font-size:13px;text-shadow:0 1px 3px #000}
  #session b{color:var(--ok)}
  #zonebar{display:flex;height:6px}
  #zonebar div{flex:1;background:var(--line);transition:background .15s}
  #zonebar .on.L{background:var(--l)} #zonebar .on.C{background:var(--c)} #zonebar .on.R{background:var(--r)}
  #controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
  button{font:inherit;font-size:15px;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
  button:active{background:#242d38}
  button.primary{background:#1d4d33;border-color:#2c7a4b;font-weight:700}
  button.primary.running{background:#5a1f1f;border-color:#a33}
  button:focus-visible{outline:2px solid var(--l)}
  #msg{padding:0 10px 6px;font-size:13px;color:var(--dim);min-height:1.4em}
  details{margin:0 10px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  summary{padding:10px 12px;cursor:pointer;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:0 12px 12px}
  .grid label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
  .grid input[type=number],.grid input[type=text],.grid select{font:inherit;font-size:15px;padding:7px 8px;border-radius:7px;border:1px solid var(--line);background:#0d1115;color:var(--fg);width:100%}
  .grid .wide{grid-column:1/-1}
  .grid .chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
  .row{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
  .row button{flex:1;padding:9px 4px;font-size:14px}
  #log{margin:0 10px 14px;font-size:12px;color:#c3ccd6;line-height:1.5;max-height:160px;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
  #log .ev{color:var(--fg)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="hud">
    <div id="status">待機中</div>
    <div id="metrics"></div>
  </div>
  <div id="session">セッション <b>—</b></div>
</div>
<div id="zonebar"><div class="L"></div><div class="C"></div><div class="R"></div></div>

<div id="controls">
  <button id="btnStart" class="primary">開始</button>
  <button id="btnCal">3 mで校正</button>
  <button id="btnCsv">CSVを保存</button>
</div>
<div id="msg">「開始」でカメラ・音声・モデルを起動します。</div>

<details id="settings">
  <summary>設定（通電点字・距離・音声）</summary>
  <div class="grid">
    <label class="wide">接近・正面 の点字文<input type="text" id="s_brlC" placeholder="まえ ひと"></label>
    <label class="wide">接近・左 の点字文<input type="text" id="s_brlL" placeholder="ひだり ひと"></label>
    <label class="wide">接近・右 の点字文<input type="text" id="s_brlR" placeholder="みぎ ひと"></label>
    <label class="wide">静止時の点字文（空欄＝送らない。{z} は まえ/ひだり/みぎ に置換）<input type="text" id="s_brlStatic" placeholder="{z} とまる"></label>
    <label>接近中の再送間隔 (秒, 0=1回だけ)<input type="number" id="s_brlRepeatSec" step="0.5" min="0"></label>
    <label>点字の言語<select id="s_brlLang"><option value="ja">かな点字</option><option value="en">英語点字（G1）</option></select></label>
    <label>点あり 通電 (ms)<input type="number" id="s_brlLong" step="10" min="20"></label>
    <label>点なし 通電 (ms, 0=飛ばす)<input type="number" id="s_brlShort" step="10" min="0"></label>
    <label>点間 (ms)<input type="number" id="s_brlGap" step="10" min="0"></label>
    <label>文字間 (ms)<input type="number" id="s_brlChar" step="10" min="0"></label>
    <label>語間 (ms)<input type="number" id="s_brlSpace" step="10" min="0"></label>
    <label>提示方式<select id="s_brlMode"><option value="0">逐次走査 D1→D6</option><option value="1">1マス同時通電</option></select></label>
    <label>音の高さ (Hz)<input type="number" id="s_toneHz" step="50" min="80"></label>
    <label>出力<select id="s_outMode"><option value="tone">音（トーン）</option><option value="buzz">振動（低周波バズ）</option><option value="both">音＋振動</option></select></label>
    <label>振動の周波数 (Hz)<input type="number" id="s_buzzHz" step="10" min="40" max="300"></label>
    <label>振動のうねり (Hz, 0=なし)<input type="number" id="s_buzzMod" step="5" min="0" max="100"></label>
    <label>音色<select id="s_wave"><option value="sine">sine（柔らかい）</option><option value="triangle">triangle（標準）</option><option value="square">square（硬い・最も明瞭）</option></select></label>
    <label>警告開始距離 (m)<input type="number" id="s_farM" step="0.1"></label>
    <label>最接近距離 (m)<input type="number" id="s_nearM" step="0.1"></label>
    <label>接近判定速度 (m/s)<input type="number" id="s_approachV" step="0.05"></label>
    <label>接近判定 t値<input type="number" id="s_tThresh" step="0.5"></label>
    <label>静止判定 (秒)<input type="number" id="s_staticSec" step="0.5"></label>
    <label>回帰窓 (秒)<input type="number" id="s_windowSec" step="0.1"></label>
    <label>標準肩幅 (mm)<input type="number" id="s_shoulderMm" step="5"></label>
    <label>標準瞳孔間距離 (mm)<input type="number" id="s_ipdMm" step="1"></label>
    <label>焦点距離 (px, 0=自動)<input type="number" id="s_focalPx" step="1"></label>
    <label>校正距離 (m)<input type="number" id="s_calibM" step="0.1"></label>
    <label>セッション長 (秒)<input type="number" id="s_sessionSec" step="5"></label>
    <label>音声の再通知間隔 (秒)<input type="number" id="s_cooldownSec" step="0.5"></label>
    <label class="chk"><input type="checkbox" id="s_speech">音声を出す</label>
    <label class="chk"><input type="checkbox" id="s_pan">左右のイヤホンに振り分ける（左＝左耳、右＝右耳、正面＝両耳）</label>
    <label class="chk"><input type="checkbox" id="s_vibrate">本体バイブも使う (Android)</label>
    <label class="wide">Pico 2 W のURL（例 https://192.168.1.50）<input type="url" id="s_picoUrl" placeholder="https://192.168.1.50" autocapitalize="off"></label>
    <label class="chk"><input type="checkbox" id="s_pico">電気刺激スイッチ（Pico）に送る　※USB接続時はURL不要</label>
    <label class="chk"><input type="checkbox" id="s_keepAlive">Bluetoothを起こしておく（無音時の頭切れ対策）</label>
    <label class="chk"><input type="checkbox" id="s_mirror">画面を左右反転（前面カメラ用）</label>
    <label class="chk"><input type="checkbox" id="s_front">前面カメラを使う</label>
  </div>
  <div class="row">
    <button id="tL">試聴 左</button><button id="tK">試聴 正面</button><button id="tR">試聴 右</button><button id="tV">音声試験</button><button id="tU">USB接続（有線）</button><button id="tM">EEGマーク（同期用）</button>
<details id="picoCfg" style="margin:8px 0;border:1px solid #888;border-radius:6px;padding:6px">
<summary style="font-weight:bold">Pico 設定（USB接続後に使用）</summary>
<div style="font-size:12px;color:#666;margin:4px 0">「読み込み」で現在値を表示 → 変更 → 「適用」で Pico に送信（電源を切ると戻る）→ 「保存」で Pico に永続化</div>
<div id="pcGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px">
 <label>mark_mode <select data-k="mark_mode"><option value="0">0 打たない</option><option value="1">1 開始時に1回</option><option value="2">2 ONごと</option></select></label>
 <label>mark_ms <input data-k="mark_ms" type="number" min="1" max="1000" style="width:70px"></label>
 <label>mark_delay_ms <input data-k="mark_delay_ms" type="number" min="0" max="5000" style="width:70px"></label>
 <label>mark_refract_ms <input data-k="mark_refract_ms" type="number" min="0" max="10000" style="width:70px"></label>
 <label>mark_reflex <select data-k="mark_reflex"><option value="1">1 反射でも打つ</option><option value="0">0 打たない</option></select></label>
 <label>ev_stim <select data-k="ev_stim"><option value="0">0 送らない</option><option value="1">1 ON/OFFを送る</option></select></label>
 <label>reflex_mm <input data-k="reflex_mm" type="number" min="50" max="3000" style="width:70px"></label>
 <label>reflex_release_mm <input data-k="reflex_release_mm" type="number" min="50" max="4000" style="width:70px"></label>
 <label>reflex_n <input data-k="reflex_n" type="number" min="1" max="50" style="width:70px"></label>
 <label>reflex_release_n <input data-k="reflex_release_n" type="number" min="1" max="50" style="width:70px"></label>
 <label>reflex_code <input data-k="reflex_code" type="text" maxlength="8" style="width:70px"></label>
 <label>reflex_dot_ms <input data-k="reflex_dot_ms" type="number" min="20" max="1000" style="width:70px"></label>
 <label>max_on_ms <input data-k="max_on_ms" type="number" min="100" max="10000" style="width:70px"></label>
 <label>report_period_ms <input data-k="report_period_ms" type="number" min="100" max="5000" style="width:70px"></label>
 <label>use_tof（要再起動） <select data-k="use_tof"><option value="1">1 使う</option><option value="0">0 使わない</option></select></label>
 <label>brl_lang <select data-k="brl_lang"><option value="ja">ja</option><option value="en">en</option></select></label>
 <label>brl_mode <select data-k="brl_mode"><option value="0">0 逐次走査</option><option value="1">1 同時</option></select></label>
 <label>brl_long_ms <input data-k="brl_long_ms" type="number" min="20" max="2000" style="width:70px"></label>
 <label>brl_short_ms <input data-k="brl_short_ms" type="number" min="0" max="2000" style="width:70px"></label>
 <label>brl_gap_ms <input data-k="brl_gap_ms" type="number" min="0" max="2000" style="width:70px"></label>
 <label>brl_char_ms <input data-k="brl_char_ms" type="number" min="0" max="5000" style="width:70px"></label>
 <label>brl_space_ms <input data-k="brl_space_ms" type="number" min="0" max="5000" style="width:70px"></label>
 <label>brl_max_chars <input data-k="brl_max_chars" type="number" min="1" max="40" style="width:70px"></label>
 <label>brl_order <input data-k="brl_order" type="text" maxlength="6" style="width:70px"></label>
</div>
<div style="margin:6px 0;display:flex;flex-wrap:wrap;gap:4px">
 <button id="pcGet">読み込み</button><button id="pcSet">適用</button><button id="pcSave">保存</button>
 <button id="pcLoad">保存値に戻す</button><button id="pcReset">初期化</button><button id="pcTest">TEST（刺激300ms＋マーク）</button>
</div>
<div style="display:flex;gap:4px;margin-bottom:4px"><input id="brlText" placeholder="点字テスト文（例: ひだり ひと せっきん）" style="flex:1"><button id="brlSend">点字送信</button></div>
<div id="brlPreview" style="font-size:12px;color:#666;margin:2px 0 6px;white-space:pre-wrap"></div>
<div style="display:flex;gap:4px"><input id="pcCmd" placeholder="任意コマンド（例: GET brl_long_ms / TXT みぎ）" style="flex:1"><button id="pcSend">送信</button></div>
<pre id="pcLog" style="font-size:11px;background:#f4f4f4;max-height:120px;overflow:auto;margin:4px 0;padding:4px;white-space:pre-wrap"></pre>
</details>
<button id="tP">Wi-Fi接続テスト</button><button id="sReset">初期値に戻す</button>
  </div>
</details>

<div id="log"></div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

/* ===================== 設定 ===================== */
const DEF = {
  brlC:'まえ ひと', brlL:'ひだり ひと', brlR:'みぎ ひと', brlStatic:'', brlRepeatSec:4, brlLang:'ja',
  brlLong:200, brlShort:60, brlGap:50, brlChar:350, brlSpace:600, brlMode:'0', toneHz:700, wave:'triangle', keepAlive:true, outMode:'both', buzzHz:120, buzzMod:30, pan:true, picoUrl:'', pico:false,
  farM:3.0, nearM:2.0, approachV:0.25, tThresh:2.0, staticSec:2.0, windowSec:1.0,
  shoulderMm:400, ipdMm:63, focalPx:0, calibM:3.0,
  sessionSec:30, cooldownSec:3,
  speech:true, vibrate:true, mirror:false, front:false,
};
const TEXT = {
  approach:{C:'正面人接近', L:'左人接近', R:'右人接近'},
  static:  {C:'正面人静止中', L:'左人静止中', R:'右人静止中'},
};
const ZONE_KANA = {C:'まえ', L:'ひだり', R:'みぎ'};

/* ===================== 点字変換（Pico の pico_usb_main_brl.py と同じ規則） =====================
   マス = 6bit 整数（bit0=点1 … bit5=点6）。0 は空白（語間）。 */
const D=(...ns)=>ns.reduce((m,n)=>m|(1<<(n-1)),0);
const VOW={a:D(1),i:D(1,2),u:D(1,4),e:D(1,2,4),o:D(2,4)};
const CONS={'':0,k:D(6),s:D(5,6),t:D(3,5),n:D(3),h:D(3,6),m:D(3,5,6),r:D(5)};
const ROWS={'':'あいうえお',k:'かきくけこ',s:'さしすせそ',t:'たちつてと',n:'なにぬねの',h:'はひふへほ',m:'まみむめも',r:'らりるれろ'};
const JA={}; for(const [c,kana] of Object.entries(ROWS)) [...kana].forEach((k,i)=>JA[k]=VOW['aiueo'[i]]|CONS[c]);
Object.assign(JA,{'や':D(3,4),'ゆ':D(3,4,6),'よ':D(3,4,5),'わ':D(3),'を':D(3,5),'ん':D(3,5,6),'っ':D(2),'ー':D(2,5),'、':D(5,6),'。':D(2,5,6),'？':D(2,6),'！':D(2,3,5)});
const DAKU={}; [...'がぎぐげござじずぜぞだぢづでどばびぶべぼ'].forEach((a,i)=>DAKU[a]='かきくけこさしすせそたちつてとはひふへほ'[i]);
const HANDAKU={}; [...'ぱぴぷぺぽ'].forEach((a,i)=>HANDAKU[a]='はひふへほ'[i]);
const YOU_BASE={}; for(const [c,kana] of Object.entries(ROWS)) if(c) YOU_BASE[kana[1]]=[kana[0],kana[2],kana[4]];
const SMALL_YOU={'ゃ':0,'ゅ':1,'ょ':2};
const P_DAKU=D(5),P_HAN=D(6),P_YOU=D(4),P_NUM=D(3,4,5,6),P_CAP=D(6);
const DIGITS={'1':D(1),'2':D(1,2),'3':D(1,4),'4':D(1,4,5),'5':D(1,5),'6':D(1,2,4),'7':D(1,2,4,5),'8':D(1,2,5),'9':D(2,4),'0':D(2,4,5)};
const EN={}; [D(1),D(1,2),D(1,4),D(1,4,5),D(1,5),D(1,2,4),D(1,2,4,5),D(1,2,5),D(2,4),D(2,4,5)].forEach((m,i)=>EN['abcdefghij'[i]]=m);
for(const ch of 'klmnopqrst') EN[ch]=EN[String.fromCharCode(ch.charCodeAt(0)-10)]|D(3);
[...'uvxyz'].forEach((ch,i)=>EN[ch]=EN['abdef'[i]]|D(3,6)); EN.w=D(2,4,5,6);
Object.assign(EN,{',':D(2),'.':D(2,5,6),'?':D(2,3,6),'!':D(2,3,5),'-':D(3,6),"'":D(3)});
function normJa(s){ return [...s].map(ch=>{ const o=ch.charCodeAt(0);
  if(o>=0x30A1&&o<=0x30F6) return String.fromCharCode(o-0x60); if(o>=0xFF10&&o<=0xFF19) return String.fromCharCode(o-0xFEE0);
  if(ch==='　') return ' '; if(ch==='ゔ') return 'う'; return ch; }).join(''); }
function encodeJa(s){
  s=normJa(s); const cells=[]; let inNum=false;
  for(let i=0;i<s.length;i++){ const ch=s[i], nxt=s[i+1]||'';
    if(ch===' '){ cells.push(0); inNum=false; continue; }
    if(ch in DIGITS){ if(!inNum){ cells.push(P_NUM); inNum=true; } cells.push(DIGITS[ch]); continue; }
    inNum=false; let pre=0, base=ch;
    if(ch in DAKU){ pre=P_DAKU; base=DAKU[ch]; } else if(ch in HANDAKU){ pre=P_HAN; base=HANDAKU[ch]; }
    if(nxt in SMALL_YOU && base in YOU_BASE){ base=YOU_BASE[base][SMALL_YOU[nxt]]; pre|=P_YOU; i++; }
    else if(ch in SMALL_YOU) base='やゆよ'[SMALL_YOU[ch]];
    else if('ぁぃぅぇぉ'.includes(ch)) base='あいうえお'['ぁぃぅぇぉ'.indexOf(ch)];
    if(base in JA){ if(pre) cells.push(pre); cells.push(JA[base]); }
  }
  return cells;
}
function encodeEn(s){ const cells=[]; let inNum=false;
  for(let ch of s){ if(ch===' '){ cells.push(0); inNum=false; continue; }
    if(ch in DIGITS){ if(!inNum){ cells.push(P_NUM); inNum=true; } cells.push(DIGITS[ch]); continue; }
    inNum=false; if(ch!==ch.toLowerCase()){ cells.push(P_CAP); ch=ch.toLowerCase(); } if(ch in EN) cells.push(EN[ch]); }
  return cells; }
function encodeBrl(s){
  if(S.brlLang==='en') return encodeEn(s);
  const cells=[]; let ja='', en='';
  for(const ch of s){ if(/^[\x21-\x7E]$/.test(ch)){ if(ja){ cells.push(...encodeJa(ja)); ja=''; } en+=ch; } else { if(en){ cells.push(...encodeEn(en)); en=''; } ja+=ch; } }
  if(ja) cells.push(...encodeJa(ja)); if(en) cells.push(...encodeEn(en));
  return cells;
}
const cellStr = m => m ? [...Array(6)].map((_,i)=>m>>i&1?i+1:'').join('') : '␣';
/* 試聴用：マス列 → [{mask,ms},...]。Pico が接続済みなら Pico の設定値、なければ画面の値で組む */
function brlP(k,def){ const pk={brlLong:'brl_long_ms',brlShort:'brl_short_ms',brlGap:'brl_gap_ms',brlChar:'brl_char_ms',brlSpace:'brl_space_ms',brlMode:'brl_mode'}[k]; const v=(usb.ok&&pc.cur&&pk in pc.cur)?pc.cur[pk]:S[k]; return v==null||v===''?def:+v; }
function brlSteps(cells){
  const L=brlP('brlLong',200),Sh=brlP('brlShort',60),G=brlP('brlGap',50),C=brlP('brlChar',350),Sp=brlP('brlSpace',600),mode=brlP('brlMode',0);
  const st=[];
  for(const m of cells.slice(0,12)){
    if(!m){ st.push({mask:0,ms:Sp}); continue; }
    if(mode===1) st.push({mask:m,ms:L});
    else { for(let d=0;d<6;d++){ const bit=1<<d; if(m&bit){ st.push({mask:bit,ms:L}); st.push({mask:0,ms:G}); } else if(Sh>0){ st.push({mask:bit,ms:Sh}); st.push({mask:0,ms:G}); } }
      if(st.length&&st[st.length-1].mask===0) st.pop(); }
    st.push({mask:0,ms:C});
  }
  return st;
}

let S = {...DEF};
try{ const saved = JSON.parse(localStorage.getItem('okimo_v3u_brl')||'{}'); S = {...DEF, ...saved}; }catch(e){}

/* ===================== 音・振動・音声 ===================== */
let actx=null,gain=null,osc=null,ka=null,panner=null,gainB=null,bosc=null,lfo=null,lfoGain=null;
function initAudio(){
  if(actx) return;
  if(navigator.audioSession){ try{ navigator.audioSession.type='playback'; }catch(e){} }
  actx=new (window.AudioContext||window.webkitAudioContext)();
  panner = actx.createStereoPanner ? actx.createStereoPanner() : null;
  const sink = panner || actx.destination; if(panner) panner.connect(actx.destination);
  // トーン系
  gain=actx.createGain(); gain.gain.value=0; gain.connect(sink);
  osc=actx.createOscillator(); osc.type=S.wave; osc.frequency.value=S.toneHz; osc.connect(gain); osc.start();
  // 振動系：低周波の矩形波（骨伝導では「ブルブル」として体感される）に、うねり(AM)を掛けて触感を粗くする
  gainB=actx.createGain(); gainB.gain.value=0; gainB.connect(sink);
  lfoGain=actx.createGain(); lfoGain.gain.value=0.5; lfoGain.connect(gainB);
  bosc=actx.createOscillator(); bosc.type='square'; bosc.frequency.value=S.buzzHz; bosc.connect(lfoGain); bosc.start();
  lfo=actx.createOscillator(); lfo.type='sine'; lfo.frequency.value=S.buzzMod||0.001;
  const depth=actx.createGain(); depth.gain.value=0.5; lfo.connect(depth); depth.connect(lfoGain.gain); lfo.start();
  ka=actx.createGain(); ka.gain.value=S.keepAlive?0.02:0; ka.connect(actx.destination);
  const ko=actx.createOscillator(); ko.type='sine'; ko.frequency.value=40; ko.connect(ka); ko.start();
}
function beep(ms=80,hz=1200){ if(!actx) return; const t=actx.currentTime; osc.frequency.setValueAtTime(hz,t); gain.gain.setValueAtTime(0.6,t); gain.gain.setValueAtTime(0,t+ms/1000); osc.frequency.setValueAtTime(S.toneHz,t+ms/1000+0.01); }


/* ===== USB 有線接続（WebUSB, Android Chrome）: Pico の USB シリアル(CDC)を直接つかむ ===== */
const usb={dev:null,epIn:null,epOut:null,ctrlIf:null,dataIf:null,ok:false,rx:''};
async function usbConnect(){
  if(!navigator.usb){ setMsg('この端末のブラウザは WebUSB 非対応です（Android の Chrome を使ってください）'); return; }
  try{
    const dev=await navigator.usb.requestDevice({filters:[{vendorId:0x2E8A}]});   // Raspberry Pi
    await dev.open(); if(dev.configuration===null) await dev.selectConfiguration(1);
    for(const itf of dev.configuration.interfaces){
      const alt=itf.alternates[0];
      if(alt.interfaceClass===0x02) usb.ctrlIf=itf.interfaceNumber;
      if(alt.interfaceClass===0x0A){ usb.dataIf=itf.interfaceNumber; for(const ep of alt.endpoints){ if(ep.type==='bulk'){ if(ep.direction==='out') usb.epOut=ep.endpointNumber; else usb.epIn=ep.endpointNumber; } } }
    }
    if(usb.ctrlIf!=null){ try{ await dev.claimInterface(usb.ctrlIf); }catch(e){} }
    await dev.claimInterface(usb.dataIf);
    // 115200 8N1 と DTR/RTS（CDC の作法。MicroPython は無くても動くが念のため）
    try{ await dev.controlTransferOut({requestType:'class',recipient:'interface',request:0x20,value:0,index:usb.ctrlIf??0}, new Uint8Array([0x00,0xC2,0x01,0x00,0,0,8])); }catch(e){}
    try{ await dev.controlTransferOut({requestType:'class',recipient:'interface',request:0x22,value:0x03,index:usb.ctrlIf??0}); }catch(e){}
    usb.dev=dev; usb.ok=true; usbReadLoop();
    dev.addEventListener?.('disconnect',()=>{ usb.ok=false; usb.dev=null; });
    navigator.usb.addEventListener('disconnect',ev=>{ if(ev.device===usb.dev){ usb.ok=false; usb.dev=null; setMsg('USB が外れました'); } });
    await usbWrite('PING'); await usbWrite('REPORT 1'); setTimeout(()=>usbWrite('GET'),400);
    setMsg('USB 接続しました（Pico）。'); logEvent('usb connected',{event:'usb_connected'});
  }catch(e){ usb.ok=false; setMsg('USB 接続できません: '+e.message); }
}
async function usbWrite(line){
  if(!usb.ok) return false;
  try{ await usb.dev.transferOut(usb.epOut, new TextEncoder().encode(line+'\n')); return true; }
  catch(e){ usb.ok=false; setMsg('USB 送信失敗: '+e.message); return false; }
}
async function usbReadLoop(){
  const dec=new TextDecoder();
  while(usb.ok){
    try{
      const r=await usb.dev.transferIn(usb.epIn,64);
      usb.rx+=dec.decode(r.data); let i;
      while((i=usb.rx.indexOf('\n'))>=0){ const line=usb.rx.slice(0,i).trim(); usb.rx=usb.rx.slice(i+1); if(line) usbLine(line); }
    }catch(e){ usb.ok=false; break; }
  }
}

/* ===== Pico 設定パネル ===== */
const pc={cur:{},log:[]};
function pcLogLine(t){ pc.log.push(t); if(pc.log.length>40) pc.log.shift(); const el=document.getElementById('pcLog'); if(el){ el.textContent=pc.log.join('\n'); el.scrollTop=el.scrollHeight; } }
function pcFill(P){ pc.cur=P; document.querySelectorAll('#pcGrid [data-k]').forEach(el=>{ const k=el.dataset.k; if(k in P) el.value=String(P[k]); }); }
async function pcSendCmd(c){ if(!usb.ok){ setMsg('先に「USB接続（有線）」を押してください'); return false; } pcLogLine('> '+c); return await usbWrite(c); }
function pcHandleLine(line){
  if(line.startsWith('P ')){ try{ pcFill(JSON.parse(line.slice(2))); pcLogLine('現在値を読み込みました'); }catch(e){ pcLogLine(line); } return true; }
  if(/^(OK|ERR|BUSY|PONG|[a-z_]+=)/.test(line)||line.startsWith('SET ')||line.startsWith('PING ')){ pcLogLine(line); return true; }
  if(line.startsWith('OKIMO USB READY')){ pcLogLine(line); return true; }
  return false;
}

  g('pcCmd').addEventListener('keydown',e=>{ if(e.key==='Enter') g('pcSend').onclick(); });
})();
function usbLine(line){
  if(pcHandleLine(line)) { if(line==='PONG') setMsg('Pico応答: PONG（USB）'); return; }
  if(line.startsWith('S ')){ try{ const j=JSON.parse(line.slice(2)); if(j.reflex!==picoState.reflex) logEvent(j.reflex?`Pico反射ON ${j.mm}mm`:'Pico反射OFF',{event:j.reflex?'pico_reflex_on':'pico_reflex_off'}); picoState.mm=j.mm; picoState.reflex=j.reflex; picoState.ok=true; }catch(e){} }
  else if(line.startsWith('E ')){ let j=null; try{ j=JSON.parse(line.slice(2)); }catch(e){}
    if(j&&j.kind==='mark'){ logEvent(`EEGマーク ${j.src} ${j.dur}ms pico_ms=${j.ms}`,{event:'mark',pico_ms:j.ms,mark_src:j.src}); }
    else if(j&&j.kind==='txt'){ logEvent(`Pico点字 ${j.text} [${(j.cells||[]).map(cellStr).join(' ')}]`,{event:'pico_txt',brl:j.text,brl_cells:(j.cells||[]).map(cellStr).join(' ')}); }
    else if(j&&j.kind==='on'){ addRow({event:'pico_on',brl_cells:cellStr(j.mask),pico_ms:j.ms}); }
    else if(j&&j.kind==='done'){ brl.busyUntil=0; logEvent(`Pico点字 終了 ${j.dur}ms`,{event:'pico_done',pico_ms:j.ms}); }
    else if(j&&(j.kind==='stim_on'||j.kind==='stim_off')){ logEvent(`Pico ${j.kind} pico_ms=${j.ms}`,{event:j.kind,pico_ms:j.ms}); }
    else logEvent('Pico '+line.slice(2),{event:'pico_event',pico_ms:j?j.ms:''}); }
  else if(line==='PONG'){ setMsg('Pico応答: PONG（USB）'); }
}
/* 経路の振り分け：USB がつながっていれば USB、なければ Wi-Fi(http) */
function picoCmd(path){
  if(path.startsWith('/morse?seq=')) return 'MORSE '+path.slice(11);
  if(path.startsWith('/txt?text=')) return 'TXT '+decodeURIComponent(path.slice(10));
  if(path==='/stop') return 'STOP';
  if(path==='/ping') return 'PING';
  return null;
}
/* Pico 2 W（フォトMOSリレーで低周波電極回路を開閉）へ同じ on/off 列を送る */
let picoErr=0;
function sendPico(path){
  if(!S.pico) return;
  if(usb.ok){ const c=picoCmd(path); if(c) usbWrite(c); return; }
  if(!S.picoUrl) return;
  const u=S.picoUrl.replace(/\/+$/,'')+path;
  fetch(u,{mode:'cors',cache:'no-store',keepalive:true}).then(()=>{ picoErr=0; }).catch(()=>{ if(++picoErr<=3) setMsg('Picoに送れません: '+u+'（同じWi-Fiか、Chromeのフラグ設定を確認）'); });
}
/* Pico の反射層（レーザーToF）の状態を毎 0.5 秒読み、CSV と画面に残す */
const picoState={mm:null,reflex:0,ok:false};
async function pollPico(){
  if(usb.ok||!S.pico||!S.picoUrl||!running) return;
  try{ const j=await (await fetch(S.picoUrl.replace(/\/+$/,'')+'/sensors',{mode:'cors',cache:'no-store'})).json();
    if(j.reflex!==picoState.reflex) logEvent(j.reflex?`Pico反射ON ${j.mm}mm`:'Pico反射OFF',{event:j.reflex?'pico_reflex_on':'pico_reflex_off'});
    picoState.mm=j.mm; picoState.reflex=j.reflex; picoState.ok=true;
  }catch(e){ picoState.ok=false; }
}
setInterval(pollPico,500);
function playPattern(seq, pan=0){ // 返り値: 総時間 ms。pan: -1=左耳, 0=両耳, +1=右耳
  sendPico('/morse?seq='+seq.map(v=>Math.round(v)).join(','));
  if(!actx) return seq.reduce((a,b)=>a+b,0);
  const now=actx.currentTime;
  if(panner) panner.pan.setValueAtTime(S.pan?pan:0, now);
  osc.type=S.wave; osc.frequency.setValueAtTime(S.toneHz,now);
  bosc.frequency.setValueAtTime(S.buzzHz,now); lfo.frequency.setValueAtTime(S.buzzMod||0.001,now);
  const useT = S.outMode!=='buzz', useB = S.outMode!=='tone';
  for(const g of [gain,gainB]){ g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(0,now); }
  let t=now+0.05,total=0; const volT=S.wave==='square'?0.5:0.9, volB=0.8;
  const env=(g,vol,t,on)=>{ const r=Math.min(0.006,on/4); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+r); g.gain.setValueAtTime(vol,t+on-r); g.gain.linearRampToValueAtTime(0,t+on); };
  for(let i=0;i<seq.length;i+=2){
    const on=seq[i]/1000;
    if(useT) env(gain,volT,t,on);
    if(useB) env(gainB,volB,t,on);
    t+=on+seq[i+1]/1000; total+=seq[i]+seq[i+1];
  }
  if(S.vibrate&&navigator.vibrate){ try{ navigator.vibrate(seq); }catch(e){} }
  return total;
}
/* 点字の試聴：点1..6 を音高で区別（左列 低め・右列 高め）。返り値: 総時間 ms */
const DOT_HZ=[440,523,659,880,1047,1319];
function playBrl(steps, pan=0){
  if(!actx) return steps.reduce((a,s)=>a+s.ms,0);
  const now=actx.currentTime;
  if(panner) panner.pan.setValueAtTime(S.pan?pan:0, now);
  osc.type=S.wave; bosc.frequency.setValueAtTime(S.buzzHz,now); lfo.frequency.setValueAtTime(S.buzzMod||0.001,now);
  const useT = S.outMode!=='buzz', useB = S.outMode!=='tone';
  for(const g of [gain,gainB]){ g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(0,now); }
  osc.frequency.cancelScheduledValues(now);
  let t=now+0.05,total=0; const volT=S.wave==='square'?0.5:0.9, volB=0.8, vib=[];
  const env=(g,vol,t,on)=>{ const r=Math.min(0.006,on/4); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+r); g.gain.setValueAtTime(vol,t+on-r); g.gain.linearRampToValueAtTime(0,t+on); };
  for(const s of steps){
    const on=s.ms/1000;
    if(s.mask){ let hz=0,n=0; for(let d=0;d<6;d++) if(s.mask>>d&1){ hz+=DOT_HZ[d]; n++; } osc.frequency.setValueAtTime(hz/n,t);
      if(useT) env(gain,volT,t,on); if(useB) env(gainB,volB,t,on); vib.push(s.ms); }
    else { if(vib.length%2===1) vib.push(s.ms); else if(vib.length) vib[vib.length-1]+=s.ms; }
    t+=on; total+=s.ms;
  }
  if(S.vibrate&&navigator.vibrate){ try{ navigator.vibrate(vib); }catch(e){} }
  return total;
}
function speak(text){
  if(!S.speech || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=1.1;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* 通電点字の送信：接近中は「状態（接近＋方向）が変わったとき」と「再送間隔ごと」に 1 メッセージ送る。
   Pico が接続されていれば TXT で文字列を渡し（変換は Pico 側）、同時に骨伝導へ試聴音を流す。 */
let brl = {key:null, lastT:0, busyUntil:0};
function brlSend(text, pan=0, why='brl'){
  const cells = encodeBrl(text);
  if(!cells.length) return 0;
  sendPico('/txt?text='+encodeURIComponent(text));
  const steps = brlSteps(cells);
  const ms = playBrl(steps, pan);
  brl.busyUntil = performance.now()+ms;
  logEvent(`${why} ${text} [${cells.map(cellStr).join(' ')}] ${ms}ms`, {event:why, brl:text, brl_cells:cells.map(cellStr).join(' ')});
  return ms;
}
function brlTrigger(kind, zone, tsec){
  const text = kind==='approach' ? brlTextFor(zone) : (S.brlStatic||'').replace('{z}', ZONE_KANA[zone]);
  if(!text) return;
  const key = kind+zone;
  const due = key!==brl.key || (S.brlRepeatSec>0 && tsec-brl.lastT>=S.brlRepeatSec);
  if(!due || performance.now()<brl.busyUntil) return;
  brl.key=key; brl.lastT=tsec;
  brlSend(text, zone==='L'?-1:zone==='R'?1:0, kind==='approach'?'brl_approach':'brl_static');
}
function brlStop(){ brl.key=null; brl.busyUntil=0; if(S.pico) sendPico('/stop'); if(actx) for(const g of [gain,gainB]){ g.gain.cancelScheduledValues(actx.currentTime); g.gain.setValueAtTime(0,actx.currentTime); } if(navigator.vibrate) navigator.vibrate(0); }

/* ===================== 記録（CSV） ===================== */
let rows=[], session=null, sessionSeq=0;
const CSV_HEAD = ['session_id','timestamp','t_session_s','detected','zone','x_center','eye_px','shoulder_px','distance_m','velocity_mps','t_value','state','event','brl','brl_cells','pico_ms','pico_mm','pico_reflex'];
function iso(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,'0')}`; }
function addRow(extra={}){
  if(!session) return;
  rows.push({
    session_id:session.id, timestamp:iso(), t_session_s:((performance.now()-session.t0)/1000).toFixed(3),
    detected:cur.detected?1:0, zone:cur.zone||'', x_center:cur.cx!=null?cur.cx.toFixed(3):'',
    eye_px:cur.eyePx?cur.eyePx.toFixed(1):'', shoulder_px:cur.shPx?cur.shPx.toFixed(1):'',
    distance_m:cur.d!=null?cur.d.toFixed(2):'', velocity_mps:cur.v!=null?cur.v.toFixed(2):'', t_value:cur.tv!=null?cur.tv.toFixed(2):'',
    state:cur.state, event:extra.event||'', brl:extra.brl||'', brl_cells:extra.brl_cells||'', pico_ms:extra.pico_ms??'',
    pico_mm:picoState.mm??'', pico_reflex:picoState.ok?picoState.reflex:'',
  });
}
function logEvent(text, extra={}){
  addRow({event: extra.event ?? text, brl: extra.brl, brl_cells: extra.brl_cells, pico_ms: extra.pico_ms});
  const el=document.getElementById('log'); const div=document.createElement('div'); div.className='ev'; div.textContent = `${iso().slice(11,23)}  ${text}`; el.prepend(div);
  while(el.children.length>40) el.lastChild.remove();
}
function sessionStart(){
  sessionSeq++; const id = iso().replace(/[-:T.]/g,'').slice(0,15)+'_'+String(sessionSeq).padStart(2,'0');
  session = {id, t0:performance.now()};
  logEvent(`session start ${id}`, {event:'session_start'});
}
function sessionEnd(){ logEvent('session end', {event:'session_end'}); session=null; beep(80,1200); setTimeout(()=>beep(80,1200),140); }
function csvText(){
  const esc = v => { v=String(v??''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  return '\uFEFF' + CSV_HEAD.join(',') + '\n' + rows.map(r=>CSV_HEAD.map(h=>esc(r[h])).join(',')).join('\n');
}
async function exportCsv(){
  if(!rows.length){ setMsg('記録がまだありません。'); return; }
  const name = 'okimo_'+iso().replace(/[-:T]/g,'').slice(0,15)+'.csv';
  const blob = new Blob([csvText()], {type:'text/csv;charset=utf-8'});
  const file = new File([blob], name, {type:'text/csv'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); setMsg(`共有しました: ${name}（${rows.length}行）`); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setMsg(`保存しました: ${name}（${rows.length}行）`);
}

/* ===================== 検出・距離・接近判定 ===================== */
const video=document.getElementById('video'), canvas=document.getElementById('overlay'), ctx=canvas.getContext('2d');
let landmarker=null, stream=null, running=false, wakeLock=null;
const cur = {detected:false, zone:null, cx:null, eyePx:null, shPx:null, d:null, v:null, tv:null, state:'none', lastSeen:0};
let hist=[], lastSpoken={key:null,t:0}, staticSince=null, prevZone=null, prevState='none', calibBuf=[];

/* 検出器の差し替え点：video から {le,re,ls,rs}（各 {x,y,vis}、xyは0–1正規化）を返せばよい */
function detectPerson(ts){
  const res = landmarker.detectForVideo(video, ts);
  const lm = res.landmarks && res.landmarks[0]; if(!lm) return null;
  const P = i => ({x:lm[i].x, y:lm[i].y, vis: lm[i].visibility ?? 1});
  return {le:P(2), re:P(5), ls:P(11), rs:P(12), nose:P(0)};
}
function measure(p, W, H){
  const px = (a,b)=>Math.hypot((a.x-b.x)*W, (a.y-b.y)*H);
  const eyeOk = p.le.vis>0.5 && p.re.vis>0.5, shOk = p.ls.vis>0.5 && p.rs.vis>0.5;
  const eyePx = eyeOk ? px(p.le,p.re) : null, shPx = shOk ? px(p.ls,p.rs) : null;
  const focal = S.focalPx>0 ? S.focalPx : 0.78*W;            // 自動：水平画角≈65°相当
  let d=null;
  if(shPx && shPx>4) d = focal*S.shoulderMm/1000/shPx;      // 肩幅優先（3 mで十分な画素数）
  else if(eyePx && eyePx>3) d = focal*S.ipdMm/1000/eyePx;   // 目間距離は近距離の補助
  const cx = shOk ? (p.ls.x+p.rs.x)/2 : (eyeOk ? (p.le.x+p.re.x)/2 : p.nose.x);
  return {eyePx, shPx, d, cx};
}
/* 直近 windowSec 秒の距離の回帰勾配（m/s）とその t 値 */
function regress(){
  const n=hist.length; if(n<4) return {v:null,tv:null};
  const t0=hist[0].t; let sx=0,sy=0,sxx=0,sxy=0;
  for(const h of hist){ const x=h.t-t0; sx+=x; sy+=h.d; sxx+=x*x; sxy+=x*h.d; }
  const den = n*sxx-sx*sx; if(den<=0) return {v:null,tv:null};
  const b=(n*sxy-sx*sy)/den, a=(sy-b*sx)/n;
  let sse=0; for(const h of hist){ const e=h.d-(a+b*(h.t-t0)); sse+=e*e; }
  const se = Math.sqrt(sse/(n-2)) / Math.sqrt(sxx - sx*sx/n);
  return {v:b, tv: se>0 ? b/se : (b<0?-99:99)};
}
function setStatus(text, zone){ const el=document.getElementById('status'); el.textContent=text; el.className = zone ? zone.toLowerCase() : ''; document.querySelectorAll('#zonebar div').forEach(z=>z.classList.toggle('on', z.classList.contains(zone||''))); }
function setMsg(t){ document.getElementById('msg').textContent=t; }

function step(now){
  if(!running) return;
  const tsec = now/1000;
  if(video.readyState>=2){
    const W=canvas.width=video.videoWidth, H=canvas.height=video.videoHeight;
    let p=null; try{ p = detectPerson(now); }catch(e){}
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(W/3,0); ctx.lineTo(W/3,H); ctx.moveTo(2*W/3,0); ctx.lineTo(2*W/3,H); ctx.stroke();
    if(p){
      const m = measure(p,W,H);
      cur.detected=true; cur.lastSeen=tsec; Object.assign(cur, m);
      const cxDisp = S.mirror ? 1-m.cx : m.cx;
      cur.zone = cxDisp<1/3 ? 'L' : cxDisp>2/3 ? 'R' : 'C';
      if(m.d!=null){ hist.push({t:tsec,d:m.d}); while(hist.length && tsec-hist[0].t > S.windowSec) hist.shift(); }
      if(m.shPx){ calibBuf.push(m.shPx); if(calibBuf.length>15) calibBuf.shift(); }
      // 描画
      const dot=(q,c)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(q.x*W,q.y*H,6,0,7); ctx.fill(); };
      ctx.strokeStyle='#6fdc8c'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(p.ls.x*W,p.ls.y*H); ctx.lineTo(p.rs.x*W,p.rs.y*H); ctx.stroke();
      dot(p.ls,'#6fdc8c'); dot(p.rs,'#6fdc8c'); dot(p.le,'#5ec8ff'); dot(p.re,'#5ec8ff');
      if(!session) sessionStart();
    } else {
      if(tsec-cur.lastSeen > 0.7){ cur.detected=false; cur.zone=null; cur.d=cur.v=cur.tv=null; cur.eyePx=cur.shPx=null; hist=[]; }
    }
    if(S.mirror){ canvas.style.transform='scaleX(-1)'; video.style.transform='scaleX(-1)'; } else { canvas.style.transform=''; video.style.transform=''; }
  }

  /* 状態判定 */
  const r = regress(); cur.v=r.v; cur.tv=r.tv;
  let state='none';
  if(cur.detected && cur.d!=null && cur.d<=S.farM){
    const approaching = r.v!=null && r.v < -S.approachV && r.tv < -S.tThresh;
    if(approaching){ state='approach'; staticSince=null; }
    else { if(staticSince==null) staticSince=tsec; state = (tsec-staticSince>=S.staticSec) ? 'static' : 'watch'; }
  } else { staticSince=null; }
  cur.state=state;

  if(state==='approach'){
    brlTrigger('approach', cur.zone, tsec);
    const key='approach'+cur.zone;
    if(key!==lastSpoken.key || tsec-lastSpoken.t > S.cooldownSec){ speak(TEXT.approach[cur.zone]); lastSpoken={key,t:tsec}; logEvent(TEXT.approach[cur.zone], {event:'speech:'+TEXT.approach[cur.zone]}); }
    setStatus(`${TEXT.approach[cur.zone]}  ${cur.d.toFixed(1)} m`, cur.zone);
  } else {
    if(state!=='static'){ if(brl.key) brl.key=null; }
    if(state==='static'){
      brlTrigger('static', cur.zone, tsec);
      const key='static'+cur.zone;
      if(key!==lastSpoken.key || tsec-lastSpoken.t > S.cooldownSec){ speak(TEXT.static[cur.zone]); lastSpoken={key,t:tsec}; logEvent(TEXT.static[cur.zone], {event:'speech:'+TEXT.static[cur.zone]}); }
      setStatus(`${TEXT.static[cur.zone]}  ${cur.d.toFixed(1)} m`, cur.zone);
    } else if(state==='watch'){ setStatus(`監視中  ${cur.d.toFixed(1)} m`, cur.zone); }
    else if(cur.detected){ setStatus(cur.d!=null ? `遠方 ${cur.d.toFixed(1)} m` : '検出（距離不明）', cur.zone); }
    else setStatus('人なし', null);
  }
  prevState=state; prevZone=cur.zone;

  document.getElementById('metrics').textContent =
    `肩 ${cur.shPx?cur.shPx.toFixed(0):'–'}px  目 ${cur.eyePx?cur.eyePx.toFixed(0):'–'}px\n速度 ${cur.v!=null?cur.v.toFixed(2):'–'} m/s  t ${cur.tv!=null?cur.tv.toFixed(1):'–'}\n点字 ${brl.key||'–'}  ${performance.now()<brl.busyUntil?'送信中':'待機'}` + (S.pico?`\nPico ${picoState.ok?(picoState.mm!=null?picoState.mm+'mm':'–'):'未接続'}${picoState.reflex?' 反射中':''}`:'');

  /* セッション記録 */
  if(session){
    addRow();
    const el=(performance.now()-session.t0)/1000;
    document.querySelector('#session b').textContent = `${session.id.slice(-2)}  ${el.toFixed(1)} / ${S.sessionSec} s`;
    if(el>=S.sessionSec) sessionEnd();
  } else document.querySelector('#session b').textContent='—';

  requestAnimationFrame(step);
}

/* ===================== 起動・停止 ===================== */
async function start(){
  const btn=document.getElementById('btnStart');
  if(running){ stop(); return; }
  try{
    initAudio(); await actx.resume(); speak('開始');           // iOSの音声ロック解除はユーザー操作内で
    setMsg('モデルを読み込み中…');
    if(!landmarker){
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      const opts = d => ({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task", delegate:d}, runningMode:"VIDEO", numPoses:1, minPoseDetectionConfidence:0.5, minTrackingConfidence:0.5});
      try{ landmarker = await PoseLandmarker.createFromOptions(vision, opts("GPU")); }
      catch(e){ landmarker = await PoseLandmarker.createFromOptions(vision, opts("CPU")); }
    }
    setMsg('カメラを起動中…');
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:S.front?'user':'environment'}, width:{ideal:640}, height:{ideal:480}}});
    video.srcObject=stream; await video.play();
    try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch(e){}
    running=true; btn.textContent='停止'; btn.classList.add('running');
    setMsg(`動作中。焦点距離 ${S.focalPx>0?S.focalPx+'px（校正済）':'自動'}。人を${S.calibM} m先に立たせて「校正」を押すと精度が上がります。`);
    requestAnimationFrame(step);
  }catch(e){ setMsg('起動できません: '+e.message+'（HTTPSで開いていますか？カメラ許可は？）'); }
}
function stop(){
  running=false; brlStop(); if(session) sessionEnd();
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  try{ wakeLock?.release(); }catch(e){}
  document.getElementById('btnStart').textContent='開始'; document.getElementById('btnStart').classList.remove('running');
  setStatus('停止', null); setMsg(`停止しました。記録 ${rows.length} 行。「CSVを保存」で書き出せます。`);
}
document.getElementById('btnStart').onclick=start;
document.getElementById('btnCsv').onclick=exportCsv;
document.getElementById('btnCal').onclick=()=>{
  if(calibBuf.length<5){ setMsg('校正できません。人の両肩が映っている状態で押してください。'); return; }
  const sh = [...calibBuf].sort((a,b)=>a-b)[Math.floor(calibBuf.length/2)];
  S.focalPx = Math.round(sh * S.calibM / (S.shoulderMm/1000)); saveS(); bindSettings();
  logEvent(`calib focal=${S.focalPx}px at ${S.calibM}m (shoulder ${sh.toFixed(1)}px)`, {event:'calib'});
  setMsg(`校正完了：焦点距離 ${S.focalPx} px（肩幅 ${sh.toFixed(0)} px @ ${S.calibM} m）`);
};
for(const [id,z,pn] of [['tK','C',0],['tL','L',-1],['tR','R',1]]) document.getElementById(id).onclick=async()=>{ initAudio(); await actx.resume(); brlSend(brlTextFor(z), pn, 'brl_test'); };
document.getElementById('brlSend').onclick=async()=>{ const t=document.getElementById('brlText').value.trim(); if(!t) return; initAudio(); await actx.resume(); brlSend(t, 0, 'brl_test'); };
document.getElementById('brlText').oninput=()=>{ const t=document.getElementById('brlText').value; const c=encodeBrl(t); const st=brlSteps(c); document.getElementById('brlPreview').textContent = c.length? `${c.length} マス: ${c.map(cellStr).join(' ')}  ≈ ${(st.reduce((a,s)=>a+s.ms,0)/1000).toFixed(1)} 秒` : ''; };
document.getElementById('tV').onclick=()=>{ speak(TEXT.approach.C); };
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && running && !wakeLock) navigator.wakeLock?.request('screen').then(w=>wakeLock=w).catch(()=>{}); });
</script>
